version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: agis
    main: ./cmd/agis
    binary: agis
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: freebsd
        goarch: "386"
      - goos: freebsd
        goarch: arm
    ldflags:
      - -s -w

universal_binaries:
  - id: agis-darwin-universal
    ids:
      - agis
    name_template: agis

archives:
  - id: default
    builds:
      - agis
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - docs/*

nfpms:
  - id: packages
    builds:
      - agis
    package_name: agis
    vendor: Facundo Salvucci
    homepage: https://github.com/SalvucciFacundo/agis
    maintainer: Facundo Salvucci
    description: AGIS — Autonomous Go Intelligent System
    license: MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/local/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/agis/LICENSE
      - src: README.md
        dst: /usr/share/doc/agis/README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
