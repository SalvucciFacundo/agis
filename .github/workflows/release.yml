name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: agis-linux-amd64
          - goos: linux
            goarch: arm64
            output: agis-linux-arm64
          - goos: darwin
            goarch: amd64
            output: agis-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: agis-darwin-arm64
          - goos: windows
            goarch: amd64
            output: agis-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Binary (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o dist/${{ matrix.output }} ./cmd/agis

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.output }}
          generate_release_notes: true
